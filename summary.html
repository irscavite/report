<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MNR Global Executive Summary</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 30px; color: #333; }
        .summary-container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 3px solid #2980b9; padding-bottom: 15px; margin-bottom: 25px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 12px 8px; border: 1px solid #dee2e6; text-align: center; }
        th { background: #2980b9; color: white; text-transform: uppercase; letter-spacing: 1px; }
        
        .line-name { font-weight: 800; background: #f8f9fa; color: #2c3e50; text-align: left; padding-left: 20px; }
        .grand-total { background: #2c3e50 !important; color: white !important; font-weight: bold; font-size: 1.1em; }
        .highlight { font-weight: bold; color: #2980b9; }
        
        /* Stats Styling */
        .pct-text { font-size: 0.85em; color: #7f8c8d; display: block; margin-top: 2px; }
        .loading { text-align: center; padding: 50px; font-size: 1.2em; color: #7f8c8d; }
        
        .btn-print { margin-top: 25px; padding: 12px 25px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .btn-print:hover { background: #219150; }
    </style>
</head>
<body>

<div class="summary-container">
    <h1>Container Operations Overview</h1>
    <div id="loader" class="loading">Generating Real-time Analytics...</div>
    
    <table id="summary-table" style="display:none;">
        <thead>
            <tr>
                <th>Shipping Line</th>
                <th>Damage (DMG)</th>
                <th>Available (AVL)</th>
                <th>Rem. Pending</th>
                <th>Rem. Approved</th>
                <th>Total Repaired</th>
                <th>Total Containers</th>
            </tr>
        </thead>
        <tbody id="summary-body">
            </tbody>
        <tfoot>
            <tr id="overall-row" class="grand-total">
                <td>OVERALL SYSTEM TOTAL</td>
                <td id="gt-dmg">0</td>
                <td id="gt-av">0</td>
                <td id="gt-pending">0</td>
                <td id="gt-approved">0</td>
                <td id="gt-repaired">0</td>
                <td id="gt-total">0</td>
            </tr>
        </tfoot>
    </table>
    
    <button class="btn-print" onclick="window.print()">Print Summary Report</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC-xiBCDw_SZz36WrDRKHszl5GhGIidXrY",
        authDomain: "eastern1961-e83f6.firebaseapp.com",
        databaseURL: "https://eastern1961-e83f6-default-rtdb.firebaseio.com",
        projectId: "eastern1961-e83f6",
        storageBucket: "eastern1961-e83f6.firebasestorage.app",
        messagingSenderId: "578815361363",
        appId: "1:578815361363:web:5d4ad5b1c2cdc3631921a6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function generateSummary() {
        const lines = ["MAERSK", "ONE", "CMA"];
        const tbody = document.getElementById('summary-body');
        
        let totals = { dmg: 0, av: 0, pending: 0, approved: 0, repaired: 0, grand: 0 };

        for (const line of lines) {
            // Fetch both Damage and Available data
            const dmgSnap = await get(ref(db, `${line}/Damage`));
            const avSnap = await get(ref(db, `${line}/Available`));

            const dmgList = (dmgSnap.val() || []).filter(i => i && i.container);
            // Sa Available, bibilangin lang ang wala pang Date Out
            const avList = (avSnap.val() || []).filter(i => i && i.container && (!i.dateOut || i.dateOut.trim() === ""));

            const lineTotal = dmgList.length + avList.length;
            
            // Logic for Rem. Pending, Rem. Approved, and Repaired (Base sa formula mo sa main app)
            let linePending = 0;
            let lineApproved = 0;
            let lineRepaired = 0;

            // Check counts for Damage folder
            dmgList.forEach(item => {
                const hasApp = item.approval && item.approval.trim() !== "";
                const hasRep = item.repairDate && item.repairDate.trim() !== "";
                
                if (!hasApp) linePending++;
                if (hasApp && !hasRep) lineApproved++;
                if (hasRep) lineRepaired++;
            });

            // Check counts for Available folder (Usually puro repaired na dito)
            avList.forEach(item => {
                const hasApp = item.approval && item.approval.trim() !== "";
                const hasRep = item.repairDate && item.repairDate.trim() !== "";
                
                if (!hasApp) linePending++;
                if (hasApp && !hasRep) lineApproved++;
                if (hasRep) lineRepaired++;
            });

            // Calculate Percentages
            const dmgPct = lineTotal > 0 ? ((dmgList.length / lineTotal) * 100).toFixed(1) : 0;
            const avPct = lineTotal > 0 ? ((avList.length / lineTotal) * 100).toFixed(1) : 0;

            const row = `
                <tr>
                    <td class="line-name">${line}</td>
                    <td><span class="highlight">${dmgList.length}</span><span class="pct-text">${dmgPct}% of Line</span></td>
                    <td><span class="highlight">${avList.length}</span><span class="pct-text">${avPct}% of Line</span></td>
                    <td>${linePending}</td>
                    <td>${lineApproved}</td>
                    <td>${lineRepaired}</td>
                    <td style="font-weight:bold; background:#f1f2f6;">${lineTotal}</td>
                </tr>
            `;
            tbody.innerHTML += row;

            // Update Grand Totals
            totals.dmg += dmgList.length;
            totals.av += avList.length;
            totals.pending += linePending;
            totals.approved += lineApproved;
            totals.repaired += lineRepaired;
            totals.grand += lineTotal;
        }

        // Display Grand Totals
        document.getElementById('gt-dmg').innerText = totals.dmg;
        document.getElementById('gt-av').innerText = totals.av;
        document.getElementById('gt-pending').innerText = totals.pending;
        document.getElementById('gt-approved').innerText = totals.approved;
        document.getElementById('gt-repaired').innerText = totals.repaired;
        document.getElementById('gt-total').innerText = totals.grand;

        document.getElementById('loader').style.display = 'none';
        document.getElementById('summary-table').style.display = 'table';
    }

    generateSummary();
</script>

</body>
</html>
